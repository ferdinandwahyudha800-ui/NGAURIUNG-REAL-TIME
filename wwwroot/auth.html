<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ngariung - Login atau Daftar">
    <title>Masuk - Ngariung</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/auth-new.css">
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo & Title -->
            <div class="auth-header">
                <div class="auth-logo">
                    <div class="logo-icon">💬</div>
                </div>
                <h1 class="auth-title">Ngariung</h1>
                <p class="auth-subtitle">Berkumpul bersama dalam satu ruang</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs" role="tablist">
                <button class="auth-tab active" id="loginTab" role="tab" aria-selected="true" aria-controls="loginPanel"
                    data-tab="login">
                    Masuk
                </button>
                <button class="auth-tab" id="registerTab" role="tab" aria-selected="false" aria-controls="registerPanel"
                    data-tab="register">
                    Daftar
                </button>
            </div>

            <!-- Login Form -->
            <div class="auth-panel active" id="loginPanel" role="tabpanel" aria-labelledby="loginTab">
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" name="email" class="form-input"
                            placeholder="nama@example.com" required autocomplete="email" aria-required="true">
                        <div class="form-error" id="loginEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-with-icon">
                            <input type="password" id="loginPassword" name="password" class="form-input"
                                placeholder="Masukkan password" required autocomplete="current-password" minlength="6"
                                aria-required="true">
                            <button type="button" class="input-icon-btn toggle-password" data-target="loginPassword"
                                aria-label="Toggle password visibility">
                                👁️
                            </button>
                        </div>
                        <div class="form-error" id="loginPasswordError"></div>
                    </div>

                    <div class="form-error" id="loginFormError"></div>

                    <button type="submit" class="btn btn-primary btn-block btn-large" id="loginSubmit">
                        Masuk
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div class="auth-panel" id="registerPanel" role="tabpanel" aria-labelledby="registerTab">
                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="registerDisplayName">Nama Tampilan <span class="required">*</span></label>
                        <input type="text" id="registerDisplayName" name="displayName" class="form-input"
                            placeholder="Nama Anda" required autocomplete="name" minlength="2" maxlength="50"
                            aria-required="true" aria-describedby="displayNameHelp">
                        <small id="displayNameHelp" class="form-help">2-50 karakter</small>
                        <div class="form-error" id="registerDisplayNameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">Email <span class="required">*</span></label>
                        <input type="email" id="registerEmail" name="email" class="form-input"
                            placeholder="nama@example.com" required autocomplete="email" aria-required="true">
                        <div class="form-error" id="registerEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Password <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <input type="password" id="registerPassword" name="password" class="form-input"
                                placeholder="Minimal 6 karakter" required autocomplete="new-password" minlength="6"
                                aria-required="true" aria-describedby="passwordHelp">
                            <button type="button" class="input-icon-btn toggle-password" data-target="registerPassword"
                                aria-label="Toggle password visibility">
                                👁️
                            </button>
                        </div>
                        <small id="passwordHelp" class="form-help">Minimal 6 karakter</small>
                        <div class="form-error" id="registerPasswordError"></div>
                    </div>

                    <div class="form-group">
                        <label for="registerConfirmPassword">Konfirmasi Password <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <input type="password" id="registerConfirmPassword" name="confirmPassword"
                                class="form-input" placeholder="Masukkan password lagi" required
                                autocomplete="new-password" minlength="6" aria-required="true">
                            <button type="button" class="input-icon-btn toggle-password"
                                data-target="registerConfirmPassword" aria-label="Toggle password visibility">
                                👁️
                            </button>
                        </div>
                        <div class="form-error" id="registerConfirmPasswordError"></div>
                    </div>

                    <div class="form-error" id="registerFormError"></div>

                    <button type="submit" class="btn btn-primary btn-block btn-large" id="registerSubmit">
                        Daftar
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <p class="auth-footer-text">
                    Dengan mendaftar, Anda menyetujui penggunaan data sesuai dengan kebijakan privasi kami.
                </p>
            </div>
        </div>

        <!-- Theme Toggle -->
        <div class="theme-toggle-container">
            <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle tema">
                <span class="theme-icon">🌙</span>
            </button>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer" role="region" aria-live="polite" aria-atomic="true">
        <!-- Toast notifications akan muncul di sini -->
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth-page.js"></script>
</body>

</html>
